# Netlify: set Base directory to apps/web; this file supplies the rest.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send API calls to Render, so the browser sees one site and no CORS setup is needed.
# Change the host if your Render service URL is different.
[[redirects]]
  from = "/api/*"
  to = "https://student-services-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path loads the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
